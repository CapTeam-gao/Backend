spring.datasource.url=jdbc:h2:mem:gao;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

jwt.secret=test-only-secret-key-with-at-least-32-bytes
jwt.access-token.expiration=4800000
jwt.refresh-token.expiration=1209600000
jwt.refresh-cookie.secure=false
jwt.refresh-cookie.same-site=Lax

websocket.allowed-origins=http://localhost:5173
ai.server.base-url=http://localhost:8000

aws.s3.bucket=test-chat-bucket
aws.s3.region=ap-northeast-2
aws.s3.key-prefix=chat
aws.s3.presigned-url-duration=PT10M
