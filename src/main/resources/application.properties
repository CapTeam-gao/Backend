spring.application.name=backend

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
# JVM 기본 시간대와 무관하게 LocalDateTime을 서울 시간 기준으로 JDBC에 저장합니다.
spring.jpa.properties.hibernate.jdbc.time_zone=${JDBC_TIME_ZONE:Asia/Seoul}
#spring.jpa.show-sql=true
#logging.level.org.springframework.security=DEBUG
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.forward-headers-strategy=framework

# EC2/Docker 상태 점검에는 인증이 필요 없는 health endpoint만 공개합니다.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

jwt.secret=${JWT_SECRET}
jwt.access-token.expiration=${JWT_ACCESS_TOKEN_EXPIRATION}
jwt.refresh-token.expiration=${JWT_REFRESH_TOKEN_EXPIRATION}
jwt.refresh-cookie.secure=${JWT_REFRESH_COOKIE_SECURE:false}
jwt.refresh-cookie.same-site=${JWT_REFRESH_COOKIE_SAME_SITE:Lax}

# AI 서버가 배치 완료를 알려주는 내부 콜백(/internal/matching/**) 인증에 쓰는 키입니다.
# 사용자 JWT가 아니라 서버 간 공유 시크릿이라 백엔드/AI 양쪽에 같은 값을 넣어야 합니다.
internal.matching-api-key=${INTERNAL_MATCHING_API_KEY}

# WebSocket handshake를 허용할 프론트엔드 Origin 목록입니다.
# 개발 중에는 기본값 "*"로 열어두고, 운영에서는 https://example.com 처럼 실제 도메인만 넣는 것이 안전합니다.
websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}

# 채팅 파일은 비공개 S3 버킷에 저장하고, DB에는 /chat-files/{channelId}/{fileName} 경로를 저장합니다.
# 파일 조회 시 백엔드가 짧게 유효한 Presigned URL을 생성해 S3로 리다이렉트합니다.
spring.servlet.multipart.max-file-size=${CHAT_FILE_MAX_SIZE:20MB}
spring.servlet.multipart.max-request-size=${CHAT_FILE_MAX_REQUEST_SIZE:20MB}
chat.file.storage-type=${CHAT_FILE_STORAGE_TYPE:s3}
chat.file.local-root=${CHAT_FILE_LOCAL_ROOT:/tmp/gao-chat-files}
chat.file.upload-dir=${CHAT_FILE_UPLOAD_DIR:${chat.file.local-root}}
chat.file.public-path=${CHAT_FILE_PUBLIC_PATH:/chat-files}

aws.s3.bucket=${AWS_S3_BUCKET}
aws.s3.region=${AWS_REGION:ap-northeast-2}
aws.s3.key-prefix=${AWS_S3_KEY_PREFIX:chat}
aws.s3.presigned-url-duration=${AWS_S3_PRESIGNED_URL_DURATION:PT10M}

# FastAPI AI 서버 설정입니다. AI 서버 내부 MySQL은 AI 쪽에서 3307 포트를 사용하고,
# 백엔드는 AI HTTP API(기본 8000번)만 호출합니다.
ai.server.base-url=${AI_SERVER_BASE_URL:http://localhost:8000}

# 동시에 실행할 팀 매칭 작업 수는 MatchingJobExecutorConfig에서 제한합니다.
# AI 서버는 X-Matching-Job-Id 헤더와 DELETE /matching/jobs/{jobId} 취소 요청을 처리해야
# 이미 시작된 LLM 호출까지 확실하게 중단할 수 있습니다.

# Firebase Cloud Messaging 설정입니다.
firebase.enabled=${FIREBASE_ENABLED:false}
firebase.project-id=${FIREBASE_PROJECT_ID:}
firebase.credentials-json=${FIREBASE_CREDENTIALS_JSON:}
firebase.credentials-file=${FIREBASE_CREDENTIALS_FILE:}

# 일지 마감 알림 설정입니다. 캡스톤 일지 작성 가능 시간은 매주 수요일 15:40~18:10(capstoneLogTime.js)이라
# 마감(18:10) 30분 전인 17:40, 수요일에만 발송되도록 기본값을 맞춥니다.
journal.reminder.enabled=${JOURNAL_REMINDER_ENABLED:true}
journal.reminder.cron=${JOURNAL_REMINDER_CRON:0 * * * * *}
journal.reminder.zone=${JOURNAL_REMINDER_ZONE:Asia/Seoul}
# java.time.DayOfWeek 기준(MONDAY=1 ... SUNDAY=7). 수요일=3.
journal.reminder.day-of-week=${JOURNAL_REMINDER_DAY_OF_WEEK:3}
journal.reminder.deadline-time=${JOURNAL_REMINDER_DEADLINE_TIME:18:10}
journal.reminder.minutes-before=${JOURNAL_REMINDER_MINUTES_BEFORE:30}
journal.reminder.title=${JOURNAL_REMINDER_TITLE:일지 마감 30분 전입니다}
journal.reminder.body=${JOURNAL_REMINDER_BODY:오늘 일지를 아직 제출하지 않았습니다. 마감 전에 제출해주세요.}
